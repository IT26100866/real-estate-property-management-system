server.port=8081

# Application Name
spring.application.name=estatex-backend

# Database Configuration (SQL Database)
# Running in SQL mode with in-memory persistence ensures zero-configuration startup for testing.
#spring.datasource.url=jdbc:h2:mem:estatex_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================================================================
# To connect to your local MySQL Server 8.0 installation, comment out the
# H2 block above and uncomment the MySQL configuration below:
# =========================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/estatex_db_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# =========================================================================

# JPA / Hibernate SQL Logging
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization (Runs schema.sql and data.sql on startup)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Visual Web Console (Accessible at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
