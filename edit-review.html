                <span>EstateX</span>

            <span class="role-badge-tag">Customer Portal</span>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Navigation</div>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Dashboard
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Browse Properties
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                My Bookings
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                My Inquiries
            </a>
            <a href="review-profile.html" class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                My Reviews
            </a>

            <div class="sidebar-section-title">Account Settings</div>
            <a href="user/profile.html" class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>

        <div class="sidebar-footer">
            <a href="login.html" class="sidebar-item sidebar-item-logout-user">

                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </a>
            <button class="sidebar-item sidebar-item-delete-user" style="background: none; border: none; cursor: pointer; width: 100%; text-align: left; padding: 10px 15px; color: #dc3545; display: flex; align-items: center; gap: 10px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">

                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>

                Delete Account

    <!-- Main Content Area (Centered Form) -->
    <main class="dashboard-main edit-page" style="flex: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background-color: #f3f4f6;">

        <!-- Glassmorphism Form Container -->
        <div class="review-container edit-container" style="width: 100%; max-width: 900px; margin: 0 auto; margin-top: 20px;">
            <h2 class="page-title">Edit Review</h2>

            <form id="editReviewForm">
                <!-- Property Info Box -->
                <div class="property-info">
                    <!-- Placeholder for the Property Image -->
                    <div class="property-img-placeholder"></div>
                    <div class="property-details">
                        <span class="prop-label">Property:</span><br>
                        <!-- Displaying the property name for ID R001 -->
                        <span class="prop-name">Luxury Villa - Colombo 7</span>
                    </div>
                </div>

                <!-- Rating Area -->
                <div class="rating-section">
                    <div class="rating-header">
                        <label class="rating-label">Overall Rating</label>
                        <div class="star-rating" id="starRating">
                            <span class="star active" data-value="1">★</span>
                            <span class="star active" data-value="2">★</span>
                            <span class="star active" data-value="3">★</span>
                            <span class="star active" data-value="4">★</span>
                            <span class="star" data-value="5">☆</span>
                        </div>
                    </div>
                    <div class="rating-subtext" id="ratingDisplay">Rating: 4.0 / 5</div>
                    <!-- Backend rating input -->
                    <input type="hidden" id="selectedRating" name="rating" value="4">
                </div>

                <!-- Comment Area -->
                <div class="form-group">
                    <label class="comment-label">Your Review Comments:</label>
                    <textarea id="reviewComment" rows="5" placeholder=""></textarea>
                    <div class="char-count" id="charCount">0 / 1000</div>
                </div>

                <!-- Buttons -->
                <div class="button-group-edit">
                    <button type="button" class="cancel-btn-outline" onclick="window.location.href='review-profile.html'">Cancel</button>
                    <button type="submit" class="update-btn">Update</button>
                </div>
            </form>
        </div>
    </main>
</div>

<!-- Centered Success Message Modal -->
<div id="successModal" class="success-overlay" style="display: none;">
    <div class="success-box">
        <div class="tick-circle">✔</div>
        <h3>Updated successfully</h3>
    </div>
</div>

<script>
    // Star Rating Click Logic
    const stars = document.querySelectorAll('#starRating .star');
    const ratingInput = document.getElementById('selectedRating');
    const ratingDisplay = document.getElementById('ratingDisplay');

    stars.forEach(star => {
        star.addEventListener('click', function() {
            const ratingValue = this.getAttribute('data-value');
            ratingInput.value = ratingValue;
            ratingDisplay.textContent = `Rating: ${ratingValue}.0 / 5`;

            stars.forEach(s => {
                if (s.getAttribute('data-value') <= ratingValue) {
                    s.classList.add('active');
                    s.textContent = '★';
                } else {
                    s.classList.remove('active');
                    s.textContent = '☆';
                }
            });
        });
    });

    // Character Count Calculation
    const commentInput = document.getElementById('reviewComment');
    const charCountDisplay = document.getElementById('charCount');

    commentInput.addEventListener('input', function() {
        const currentLength = this.value.length;
        charCountDisplay.textContent = currentLength + " / 1000";
    });

    // Handle Form Submission and Show Success Message
    const editReviewForm = document.getElementById('editReviewForm');
    const successModal = document.getElementById('successModal');

    editReviewForm.addEventListener('submit', function(e) {
        e.preventDefault();

        successModal.style.display = 'flex';

        setTimeout(() => {
            successModal.style.display = 'none';
            window.location.href = 'review-profile.html';
        }, 2500);
    });
</script>
</body>
</html>
