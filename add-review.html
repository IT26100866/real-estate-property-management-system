<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - EstateX</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Link to Profile Page with Icon -->
<a href="review-profile.html" class="profile-link">
    <div class="profile-icon">
        <!-- Default User Avatar SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
    </div>
    <span>My Profile</span>
</a>

<div class="review-container">
    <h2 class="page-title">Add Property Review</h2>

    <form class="review-form" id="addReviewForm">

        <!-- Auto-suggested Property Name (Readonly) -->
        <div class="form-group">
            <label for="property">Property Name:</label>
            <input type="text" id="property" name="property" value="Luxury Villa - Colombo 7" readonly style="background-color: #f5f5f5; color: #555;">
        </div>

        <!-- Interactive Clickable Star Rating -->
        <div class="form-group">
            <label>Rating:</label>
            <div class="star-rating" id="starRating">
                <!-- Data-value holds the star number -->
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <!-- Hidden input set to 0 initially -->
            <input type="hidden" id="rating" name="rating" value="0">
        </div>

        <!-- Text area for the review comment -->
        <div class="form-group">
            <label for="comment">Your Review:</label>
            <textarea id="comment" name="comment" rows="5" placeholder="Share your experience about this property..." required></textarea>
        </div>

        <!-- Action buttons for submit and cancel -->
        <div class="button-group">
            <button type="submit" class="submit-btn">Submit Review</button>
            <button type="button" class="cancel-btn">Cancel</button>
        </div>
    </form>
</div>

<!-- Success Popup Modal -->
<div id="successModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Success!</h3>
        <p>Review Submitted Successfully.</p>
        <button type="button" id="closeModalBtn" class="submit-btn" style="margin: 0;">OK</button>
    </div>
</div>

<!-- JavaScript code for Star Rating and Custom Success Popup -->
<script>
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');

    function updateStars(value) {
        stars.forEach(star => {
            if (star.getAttribute('data-value') <= value) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    // Set initial stars to 0 (empty)
    updateStars(0);

    stars.forEach(star => {
        star.addEventListener('click', function() {
            const value = this.getAttribute('data-value');
            ratingInput.value = value;
            updateStars(value);
        });
    });

    // Form submission logic with Custom Popup
    const modal = document.getElementById("successModal");
    const closeBtn = document.getElementById("closeModalBtn");

    document.getElementById("addReviewForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Stop page reload

        // Show the custom popup
        modal.style.display = "flex";

        // Clear the form and reset stars to 0
        document.getElementById("comment").value = "";
        ratingInput.value = "0";
        updateStars(0);
    });

    // Close modal when OK is clicked
    closeBtn.addEventListener("click", function() {
        modal.style.display = "none";
    });
</script>

</body>
</html>
