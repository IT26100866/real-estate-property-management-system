  <main class="main">
    <div class="form-card">
      <h1>Update User</h1>

      <form id="updateForm" action="#" method="post">
        <div class="field">
          <label for="userId">User ID</label>
          <input type="text" id="userId" name="userId" value="U001" readonly>
          <p class="hint">Read only</p>
        </div>

        <div class="field">
          <label for="userType">User Type</label>
          <select id="userType" name="userType">
            <option value="ADMIN" selected>Admin</option>
            <option value="AGENT">Agent</option>
          </select>
        </div>

        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" value="John Perera" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="john@email.com" required>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" value="0771234567" pattern="0[0-9]{9}" required>
        </div>

        <!-- Admin only -->
        <div class="field" id="roleField">
          <label for="role">Role</label>
          <select id="role" name="role">
            <option value="SUPER_ADMIN">Super Admin</option>
            <option value="MODERATOR" selected>Moderator</option>
            <option value="SUPPORT">Support</option>
          </select>
        </div>

        <!-- Agent only -->
        <div class="field hidden" id="licenseField">
          <label for="license">License Number</label>
          <input type="text" id="license" name="licenseNumber">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="ACTIVE" selected>Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="SUSPENDED">Suspended</option>
          </select>
        </div>

        <div class="form-actions">
          <a href="users.html" class="btn">Cancel</a>
          <button type="submit" class="btn">Update</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Show the ID from the URL, e.g. update-user.html?id=0002
    const params = new URLSearchParams(window.location.search);
    if (params.get("id")) document.getElementById("userId").value = params.get("id");

    // Role for Admin, License Number for Agent
    const userType = document.getElementById("userType");
    const roleField = document.getElementById("roleField");
    const licenseField = document.getElementById("licenseField");
    const license = document.getElementById("license");

    function toggleFields() {
      const isAdmin = userType.value === "ADMIN";
      roleField.classList.toggle("hidden", !isAdmin);
      licenseField.classList.toggle("hidden", isAdmin);
      license.required = !isAdmin;
    }
    userType.addEventListener("change", toggleFields);
    toggleFields();

    document.getElementById("updateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      // TODO (backend): fetch("/api/.../" + id, { method: "PUT", ... })
      alert("User updated (demo). Backend connect karanna passe.");
      window.location.href = "users.html";
    });
  </script>
