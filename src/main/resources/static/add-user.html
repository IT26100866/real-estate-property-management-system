  </aside>

  <main class="main">
    <div class="form-card">
      <h1>Add User</h1>

      <form id="addForm">
        <div class="field">
          <label for="userType">User Type</label>
          <select id="userType" name="userType">
            <option value="ADMIN">Admin</option>
            <option value="AGENT">Agent</option>
          </select>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" minlength="3" maxlength="50" required>
        </div>

        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" pattern="0[0-9]{9}" placeholder="0771234567" required>
          <p class="hint">10 digits, starting with 0</p>
        </div>

        <div class="field">
          <label for="address">Address (optional)</label>
          <input type="text" id="address" name="address" maxlength="500">
        </div>

        <!-- Admin only -->
        <div class="field" id="roleField">
          <label for="role">Admin Role</label>
          <select id="role" name="role">
            <option value="SUPER_ADMIN">Super Admin</option>
            <option value="MODERATOR">Moderator</option>
            <option value="SUPPORT">Support</option>
          </select>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
          <p class="hint">At least 8 characters</p>
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="SUSPENDED">Suspended</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn" id="saveBtn">Add user</button>
          <a href="users.html" class="btn">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const userType = $("userType");

    // users.html?type=agent -> Agent is pre-selected
    const typeParam = (new URLSearchParams(window.location.search).get("type") || "").toUpperCase();
    if (typeParam === "AGENT" || typeParam === "ADMIN") userType.value = typeParam;

    // Admin Role is only for admins
    function toggleFields() {
      $("roleField").classList.toggle("hidden", userType.value !== "ADMIN");
    }
    userType.addEventListener("change", toggleFields);
    toggleFields();

    $("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const isAdmin = userType.value === "ADMIN";

      const body = {
        username: $("username").value.trim(),
        fullName: $("fullName").value.trim(),
        email: $("email").value.trim(),
        phone: $("phone").value.trim(),
        address: $("address").value.trim() || null,
        password: $("password").value,
        status: $("status").value
      };
      if (isAdmin) body.role = $("role").value;

      $("saveBtn").disabled = true;
      try {
        await api(isAdmin ? "/api/admins" : "/api/agents", {
          method: "POST",
          body: JSON.stringify(body)
        });
        window.location.href = "users.html";
      } catch (err) {
        alert(err.message);
        $("saveBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
