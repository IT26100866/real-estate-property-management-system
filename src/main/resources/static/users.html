<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EstateX | Users</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <a href="dashboard.html" class="logo"><svg viewBox="0 0 40 40"><path d="M4 33 L20 17 L36 33"/><path d="M9 30 V21 L20 11 L31 21 V30"/><path d="M16 30 V24 H24 V30"/></svg><span>EstateX</span></a>
      <span class="portal-badge">Admin Portal</span>
    </div>

    <nav class="nav">
      <p class="nav-title">Administration</p>
      <a href="dashboard.html" data-key="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span class="label">Dashboard</span></a>
      <a href="users.html" data-key="users" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="label">User Management</span></a>
      <a href="users.html?type=agent" data-key="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg><span class="label">Agent Management</span></a>
      <a href="#" data-key="properties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="label">Property Management</span></a>
      <a href="#" data-key="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span class="label">Booking Management</span></a>
      <a href="#" data-key="reviews"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="label">Review Management</span></a>

      <p class="nav-title">System</p>
      <a href="#" data-key="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="label">Profile</span></a>
    </nav>

    <a href="#" class="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg><span class="label">Logout</span></a>
  </aside>

  <main class="main">
    <h1>Users</h1>
    <p class="subtitle">View, search, edit and delete admins and agents.</p>

    <div class="toolbar">
      <input type="search" id="searchBox" class="search" placeholder="Search by name, email or type">
      <a href="add-user.html" id="addBtn" class="btn">Add Admin</a>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Full Name</th><th>Email</th><th>Type</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="userBody">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
      <p class="empty" id="emptyMsg"></p>
    </div>

    <!-- Delete confirmation -->
    <div class="modal-bg" id="deleteModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
        <p id="delTitle">Are You Sure Delete ?</p>
        <div class="modal-actions">
          <button class="btn btn-grey" id="cancelDelete">Cancel</button>
          <button class="btn btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const tbody = $("userBody");
    const searchBox = $("searchBox");
    const emptyMsg = $("emptyMsg");
    const modal = $("deleteModal");

    const params = new URLSearchParams(window.location.search);
    const typeParam = (params.get("type") || "").toLowerCase();   // "agent" or ""

    let allUsers = [];
    let pending = null;                                           // user chosen for delete

    const TRASH = '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

    // "Agent Management" link in the sidebar = agents only
    if (typeParam === "agent") {
      document.querySelector("h1").textContent = "Agents";
      $("addBtn").textContent = "Add Agent";
      $("addBtn").href = "add-user.html?type=agent";
      document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
      document.querySelector('.nav a[data-key="agents"]').classList.add("active");
    }

    async function loadUsers() {
      try {
        allUsers = await api("/api/users");
        render();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6">Could not load users: ${esc(err.message)}</td></tr>`;
      }
    }

    function render() {
      const q = searchBox.value.toLowerCase().trim();

      const rows = allUsers.filter(u => {
        if (typeParam && u.type.toLowerCase() !== typeParam) return false;
        const text = [pad(u.id), u.fullName, u.email, u.type, label(u.status)].join(" ").toLowerCase();
        return !q || text.includes(q);
      });

      tbody.innerHTML = rows.map(u => `
        <tr>
          <td>${pad(u.id)}</td>
          <td>${esc(u.fullName)}</td>
          <td>${esc(u.email)}</td>
          <td>${esc(u.type)}</td>
          <td><span class="status ${(u.status || "").toLowerCase()}">${label(u.status)}</span></td>
          <td class="actions">
            <a href="update-user.html?id=${u.id}&amp;type=${u.type.toLowerCase()}" class="edit-btn">Edit</a>
            <button class="icon-btn" data-id="${u.id}" data-type="${u.type}" aria-label="Delete user">${TRASH}</button>
          </td>
        </tr>`).join("");

      emptyMsg.textContent = allUsers.length === 0
        ? "No users yet. Click the Add button to create one."
        : "No users match your search.";
      emptyMsg.style.display = rows.length === 0 ? "block" : "none";
    }

    searchBox.addEventListener("input", render);

    // ----- Delete (open popup) -----
    tbody.addEventListener("click", (e) => {
      const btn = e.target.closest(".icon-btn");
      if (!btn) return;
      pending = { id: btn.dataset.id, type: btn.dataset.type };
      modal.classList.add("open");
    });

    $("cancelDelete").addEventListener("click", () => {
      modal.classList.remove("open");
      pending = null;
    });

    // ----- Delete (confirm) -----
    $("confirmDelete").addEventListener("click", async () => {
      if (!pending) return;
      try {
        await api(`${endpointFor(pending.type)}/${pending.id}`, { method: "DELETE" });
      } catch (err) {
        alert(err.message);               // e.g. "The last Super Admin cannot be removed"
      }
      modal.classList.remove("open");
      pending = null;
      loadUsers();
    });

    loadUsers();
  </script>
</body>
</html>
