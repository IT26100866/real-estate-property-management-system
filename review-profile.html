<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Profile - EstateX</title>
    <!-- Link to the specific CSS file for this page -->
    <link rel="stylesheet" href="review_profile_styles.css">
</head>
<body class="profile-page">

<!-- Top Right Add Review Button -->
<a href="add-review.html" class="profile-link">
    <span>➕ Add New Review</span>
</a>

<!-- Profile Container -->
<div class="review-container profile-container">
    <h2 class="page-title" style="border-bottom: 3px solid #9D6B53; padding-bottom: 10px; margin-top: 0;">My Profile</h2>

    <h3 style="color: #0E1627; margin-top: 30px; margin-bottom: 15px;">My Reviews</h3>

    <!-- Reviews Table -->
    <div class="table-responsive">
        <table class="review-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Property</th>
                <th>Rating</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>R001</td>
                <td>Luxury Villa - Colombo 7</td>
                <td class="star-rating-table">
                    <span class="star active">★</span><span class="star active">★</span><span class="star active">★</span><span class="star active">★</span><span class="star active">★</span>
                </td>
                <td>
                    <a href="edit-review.html" class="edit-btn">Edit</a>
                    <!-- SVG Delete Button -->
                    <button class="delete-btn" onclick="showDeleteModal('R001')" title="Delete">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this review?</p>
        <div class="button-group">
            <button type="button" id="confirmDeleteBtn" class="cancel-btn" style="background-color: #d9534f; color: white;">Delete</button>
            <button type="button" id="cancelDeleteBtn" class="submit-btn" style="background-color: #0E1627; color: white;">Cancel</button>
        </div>
    </div>
</div>

<script>
    const deleteModal = document.getElementById("deleteModal");
    const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
    let reviewToDelete = "";

    function showDeleteModal(id) {
        reviewToDelete = id;
        deleteModal.style.display = "flex";
    }

    cancelDeleteBtn.addEventListener("click", function() {
        deleteModal.style.display = "none";
        reviewToDelete = "";
    });

    confirmDeleteBtn.addEventListener("click", function() {
        alert("Review " + reviewToDelete + " deleted successfully!");
        deleteModal.style.display = "none";
    });
</script>
</body>
</html>
