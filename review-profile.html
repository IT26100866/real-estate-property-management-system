<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Profile - EstateX</title>
    <!-- Link to the CSS file with cache-busting version -->
    <link rel="stylesheet" href="review_profile_styles.css?v=2">
</head>
<body class="profile-page">

<!-- Top Navigation Button -->
<div class="top-nav">
    <button class="add-review-top-btn" onclick="window.location.href='add-review.html'">+ Add New Review</button>
</div>

<!-- Main Profile Container -->
<div class="review-container profile-container">
    <h2 class="page-title">My Profile</h2>
    <hr class="title-divider">

    <h3 class="section-subtitle">My Reviews</h3>

    <!-- Reviews Table -->
    <table class="review-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Property</th>
            <th>Rating</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Review Row R001 -->
        <tr id="reviewRow-R001">
            <td>R001</td>
            <td>Luxury Villa - Colombo 7</td>
            <td><span class="stars-display">★★★★★</span></td>
            <td>
                <button class="edit-btn" onclick="window.location.href='edit-review.html?id=R001'">Edit</button>
                <button class="delete-btn" onclick="openDeleteModal('R001')">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteConfirmModal" class="success-overlay" style="display: none;">
    <div class="success-box delete-confirm-box">
        <h3>Confirm Delete</h3>
        <p>Are you sure you want to delete this review?</p>
        <div class="delete-modal-buttons">
            <button type="button" class="btn-delete-action" id="confirmDeleteBtn">Delete</button>
            <button type="button" class="btn-cancel-action" onclick="closeDeleteModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- Centered Deleted Success Message Modal -->
<div id="deleteSuccessModal" class="success-overlay" style="display: none;">
    <div class="success-box">
        <div class="tick-circle">✔</div>
        <h3>Deleted successfully</h3>
    </div>
</div>

<script>
    let selectedReviewId = null;

    // Open Delete Confirmation Modal
    function openDeleteModal(reviewId) {
        selectedReviewId = reviewId;
        document.getElementById('deleteConfirmModal').style.display = 'flex';
    }

    // Close Delete Confirmation Modal
    function closeDeleteModal() {
        selectedReviewId = null;
        document.getElementById('deleteConfirmModal').style.display = 'none';
    }

    // Handle Delete Action when user clicks 'Delete' in confirmation box
    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        // Close confirmation modal
        document.getElementById('deleteConfirmModal').style.display = 'none';

        // Show 'Deleted successfully' success modal in the middle
        const successModal = document.getElementById('deleteSuccessModal');
        successModal.style.display = 'flex';

        setTimeout(() => {
            successModal.style.display = 'none';

            // Remove the review row from the table dynamically
            if (selectedReviewId) {
                const row = document.getElementById('reviewRow-' + selectedReviewId);
                if (row) {
                    row.remove();
                }
            }
        }, 2000);
    });
</script>
</body>
</html>
