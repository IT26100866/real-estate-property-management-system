<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – EstateX</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    /* Scoped styles for the standalone forgot password view */
    .standalone-reset {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-soft);
      padding: 24px;
    }
    .reset-card {
      background: var(--surface);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 450px;
      width: 100%;
      border: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

  <!-- Wrapper will be either dashboard-layout or standalone depending on auth -->
  <div id="pageWrapper"></div>

  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = sessionStorage.getItem('estatex_jwt_token');
      const authUserStr = sessionStorage.getItem('estatex_auth_user');
      const wrapper = document.getElementById('pageWrapper');

      if (token && authUserStr) {
        // --- AUTHENTICATED STATE: CHANGE PASSWORD (WITH SIDEBAR) ---
        let authUser;
        try {
          authUser = JSON.parse(authUserStr);
        } catch(e) {
          authUser = { role: 'CUSTOMER', full_name: 'User' };
        }

        wrapper.innerHTML = `
          <div class="dashboard-layout">
            <aside class="dashboard-sidebar">
              <div class="sidebar-header">
                <a href="../index.html" class="brand-logo">
                  <img src="../assets/images/logo.webp" alt="EstateX Logo">
                  <span>EstateX</span>
                </a>
                <span class="role-badge-tag">${authUser.role} Portal</span>
              </div>
              <nav class="sidebar-nav">
                <div class="sidebar-section-title">Navigation</div>
                <a href="#" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                  </svg>
                  Dashboard
                </a>
                <a href="#" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                  Browse Properties
                </a>
                <a href="#" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  My Bookings
                </a>
                <a href="#" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  </svg>
                  My Inquiries
                </a>
                <a href="#" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon
                      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
                    </polygon>
                  </svg>
                  My Reviews
                </a>
                <div class="sidebar-section-title">Account Settings</div>
                <a href="profile.html" class="sidebar-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  Profile
                </a>
                <a href="reset-password.html" class="sidebar-item active">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  Change Password
                </a>
              </nav>
              <div class="sidebar-footer">
                <a href="../public/login.html" class="sidebar-item sidebar-item-logout-user">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Logout
                </a>
              </div>
            </aside>

            <div class="dashboard-main">
              <header class="dashboard-topbar">
                <div class="topbar-left">
                  <h1 class="topbar-title">Change Security Settings</h1>
                </div>
              </header>
              <main class="dashboard-content">
                <div class="card" style="max-width: 600px;">
                  <h3 style="margin-bottom: 24px; font-size: 1.25rem;">Update Password</h3>
                  <div id="changePasswordError" class="alert alert-danger" style="display: none; margin-bottom: 20px;"></div>
                  <form id="changePasswordForm">
                    <div class="form-group">
                      <label class="form-label" for="currentPassword">Current Password</label>
                      <input type="password" id="currentPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="newPassword">New Password</label>
                      <input type="password" id="newPassword" class="form-control" required minlength="6">
                      <small style="color: var(--text-muted); margin-top: 4px; display: block;">Must be at least 6 characters long.</small>
                    </div>
                    <div class="form-group">
                      <label class="form-label" for="confirmPassword">Confirm New Password</label>
                      <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                    </div>
                    <div style="display: flex; gap: 12px; margin-top: 32px;">
                      <button type="submit" class="btn btn-primary" id="changeBtn">Update Password</button>
                      <button type="button" class="btn btn-outline" onclick="window.history.back()">Cancel</button>
                    </div>
                  </form>
                </div>
              </main>
            </div>
          </div>
        `;

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const currentPassword = document.getElementById('currentPassword').value;
          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;
          const errorDiv = document.getElementById('changePasswordError');
          const btn = document.getElementById('changeBtn');

          if (newPassword !== confirmPassword) {
            errorDiv.textContent = "New passwords do not match.";
            errorDiv.style.display = 'block';
            return;
          }

          errorDiv.style.display = 'none';
          btn.disabled = true;
          btn.textContent = 'Updating...';

          try {
            const res = await fetch('http://localhost:8081/api/users/me/password', {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
              },
              body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            
            if (res.ok && data.success) {
              showToast("Success", "Your password has been updated.", "success");
              document.getElementById('changePasswordForm').reset();
            } else {
              errorDiv.textContent = data.message || "Failed to update password.";
              errorDiv.style.display = 'block';
            }
          } catch (err) {
            errorDiv.textContent = "Network error. Please try again later.";
            errorDiv.style.display = 'block';
          } finally {
            btn.disabled = false;
            btn.textContent = 'Update Password';
          }
        });

      } else {
        // --- UNAUTHENTICATED STATE: FORGOT PASSWORD (STANDALONE) ---
        wrapper.innerHTML = `
          <div class="standalone-reset">
            <div class="reset-card">
              <div style="text-align: center; margin-bottom: 24px;">
                <a href="../index.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--primary-dark); font-weight: 700; font-size: 1.5rem; justify-content: center;">
                  <img src="../assets/images/logo.webp" alt="EstateX Logo" style="height: 32px;">
                  EstateX
                </a>
              </div>
              <h2 style="text-align: center; margin-bottom: 8px; font-size: 1.5rem;">Reset Password</h2>
              <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem;">Enter your email address and we'll send you a link to reset your password.</p>
              
              <div id="forgotError" class="alert alert-danger" style="display: none; margin-bottom: 20px;"></div>
              <div id="forgotSuccess" class="alert alert-success" style="display: none; margin-bottom: 20px; background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2);"></div>
              
              <form id="forgotPasswordForm">
                <div class="form-group">
                  <label class="form-label" for="resetEmail">Email Address</label>
                  <input type="email" id="resetEmail" class="form-control" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;" id="resetBtn">Send Reset Link</button>
              </form>
              <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
                <a href="../public/login.html" style="color: var(--accent-dark); font-weight: 600; text-decoration: none;">&larr; Back to Sign In</a>
              </div>
            </div>
          </div>
        `;

        document.getElementById('forgotPasswordForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('resetEmail').value;
          const btn = document.getElementById('resetBtn');
          const successDiv = document.getElementById('forgotSuccess');
          const errorDiv = document.getElementById('forgotError');
          
          btn.disabled = true;
          btn.textContent = 'Sending...';
          errorDiv.style.display = 'none';
          
          // Mocking the reset email functionality since backend doesn't have an email endpoint
          setTimeout(() => {
            document.getElementById('forgotPasswordForm').style.display = 'none';
            successDiv.innerHTML = '<strong>Check your email!</strong><br>If an account exists with ' + email + ', a password reset link has been sent.';
            successDiv.style.display = 'block';
          }, 1000);
        });
      }

      // Add logout handler if present
      const logoutBtn = document.querySelector('.sidebar-item-logout-user');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          sessionStorage.removeItem('estatex_jwt_token');
          sessionStorage.removeItem('estatex_auth_user');
          window.location.href = '../public/login.html';
        });
      }
    });
  </script>
</body>
</html>
